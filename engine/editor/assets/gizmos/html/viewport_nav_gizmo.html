<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniVex View Navigation Gizmo</title>
<style>:root{--bg:#17181b;--x:#ff5d5d;--y:#4ade80;--z:#3b9cff;--active:#ffd933;--text:#cfd0d4;--dim:#8a8b91}*{box-sizing:border-box}html,body,main{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:12px monospace}main{position:relative}canvas{width:100%;height:100%;display:block}header{position:absolute;top:12px;left:16px;color:var(--dim);pointer-events:none}header b{color:var(--text)}</style>
</head><body><main><canvas id="gizmo"></canvas><header>VIEW <b>NAVIGATION</b> · click a direction · drag plate to orbit</header></main>
<script>
const c=document.getElementById('gizmo'),x=c.getContext('2d'),d=Math.min(devicePixelRatio||1,2);let yaw=.78,pitch=.52,hot=null,drag=null;
function resize(){c.width=c.clientWidth*d;c.height=c.clientHeight*d;draw()}addEventListener('resize',resize);
const defs=[['X',1,0,0,'#ff5d5d'],['X',-1,0,0,'#ff5d5d'],['Y',1,0,0,'#4ade80'],['Y',-1,0,0,'#4ade80'],['Z',1,0,0,'#3b9cff'],['Z',-1,0,0,'#3b9cff']];
function projected(axis,sign){let v=axis==='X'?{x:sign,y:0,z:0}:axis==='Y'?{x:0,y:sign,z:0}:{x:0,y:0,z:sign};const cy=Math.cos(-yaw),sy=Math.sin(-yaw),xx=v.x*cy+v.z*sy,zz=-v.x*sy+v.z*cy,cp=Math.cos(-pitch),sp=Math.sin(-pitch),yy=v.y*cp-zz*sp;return {x:xx,y:-yy,z:v.y*sp+zz*cp}}
function draw(){const w=c.width,h=c.height,cx=w*.78,cy=h*.26,R=Math.min(w,h)*.16; x.clearRect(0,0,w,h);x.fillStyle='#17181b';x.fillRect(0,0,w,h);const g=x.createRadialGradient(cx-R*.3,cy-R*.3,R*.15,cx,cy,R);g.addColorStop(0,'rgba(48,50,58,.96)');g.addColorStop(1,'rgba(18,19,23,.96)');x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=16*d;x.shadowOffsetY=3*d;x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.fillStyle=g;x.fill();x.shadowColor='transparent';x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.strokeStyle=drag?'rgba(255,217,51,.75)':'rgba(255,255,255,.12)';x.lineWidth=(drag?2.4:1.4)*d;x.stroke();x.font=`bold ${Math.round(9.5*d)}px monospace`;x.textAlign='center';x.textBaseline='middle';defs.forEach((q,i)=>{const p=projected(q[0],q[1]),L=Math.hypot(p.x,p.y),deg=L<.18,n=deg?{x:0,y:0}:{x:p.x/L,y:p.y/L},px=cx+n.x*R*.68,py=cy+n.y*R*.68,key=i,hover=hot===key,col=hover?'#ffd933':q[4];if(deg){x.beginPath();x.arc(cx,cy,(p.z>0?R*.13:R*.18),0,Math.PI*2);x.strokeStyle=col;x.lineWidth=2*d;x.stroke()}else{x.beginPath();x.moveTo(cx,cy);x.lineTo(px,py);x.strokeStyle=col;x.lineWidth=(hover?4.4:3)*d;x.stroke();x.beginPath();x.arc(px,py,(hover?12:9.5)*d,0,Math.PI*2);x.fillStyle=q[1]>0?'#fff':'#1c1d21';x.fill();x.strokeStyle=col;x.lineWidth=1.8*d;x.stroke();x.fillStyle=q[1]>0?'#14151a':col;x.fillText(q[0],px,py+.5)}});x.beginPath();x.arc(cx,cy,5*d,0,Math.PI*2);x.fillStyle='#ededed';x.fill()}
function pick(mx,my){const w=c.width,h=c.height,cx=w*.78,cy=h*.26,R=Math.min(w,h)*.16;for(let i=0;i<defs.length;i++){const p=projected(defs[i][0],defs[i][1]),L=Math.hypot(p.x,p.y),nx=L<.18?cx:cx+p.x/L*R*.68,ny=L<.18?cy:cy+p.y/L*R*.68;if(Math.hypot(mx-nx,my-ny)<15*d)return i}return null}
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*d,my=(e.clientY-r.top)*d;if(drag){yaw=drag.yaw-(mx-drag.x)*.01;pitch=Math.max(-1.5,Math.min(1.5,drag.pitch+(my-drag.y)*.01));draw();return}hot=pick(mx,my);draw()});c.addEventListener('mousedown',e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*d,my=(e.clientY-r.top)*d;if(Math.hypot(mx-c.width*.78,my-c.height*.26)<Math.min(c.width,c.height)*.16)drag={x:mx,y:my,yaw,pitch}});addEventListener('mouseup',()=>drag=null);resize();
</script></body></html>
