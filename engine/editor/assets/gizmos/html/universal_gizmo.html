<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniVex Universal Gizmo</title>
<style>:root{--bg:#17181b;--text:#cfd0d4;--dim:#8a8b91;--x:#ff5d5d;--y:#4ade80;--z:#3b9cff;--active:#ffd933}*{box-sizing:border-box}html,body,main{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:12px monospace}main{position:relative}canvas{width:100%;height:100%;display:block}header{position:absolute;top:12px;left:16px;color:var(--dim);pointer-events:none}header b{color:var(--text)}</style>
</head><body><main><canvas id="gizmo"></canvas><header>GIZMO <b>UNIVERSAL</b> · <span>T</span> · World / Local</header></main>
<script>
const c=document.getElementById('gizmo'),x=c.getContext('2d'),d=Math.min(devicePixelRatio||1,2);let hot=null;
function resize(){c.width=c.clientWidth*d;c.height=c.clientHeight*d;draw()}addEventListener('resize',resize);
function arrow(cx,cy,dx,dy,col,key,box=false){const l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l,end={x:cx+dx,y:cy+dy},h=hot===key;x.lineCap='round';x.lineJoin='round';x.strokeStyle='rgba(10,10,12,.65)';x.lineWidth=(h?11:9)*d;x.beginPath();x.moveTo(cx,cy);x.lineTo(end.x,end.y);x.stroke();x.strokeStyle=h?'#ffd933':col;x.lineWidth=(h?7:5)*d;x.beginPath();x.moveTo(cx,cy);x.lineTo(end.x,end.y);x.stroke();if(box){const s=(h?15:12)*d;x.fillStyle=h?'#ffd933':col;x.fillRect(end.x-s/2,end.y-s/2,s,s);x.strokeStyle='rgba(10,10,12,.7)';x.lineWidth=2*d;x.strokeRect(end.x-s/2,end.y-s/2,s,s)}else{const s=(h?15:13)*d,b={x:end.x-ux*s*.65,y:end.y-uy*s*.65};x.beginPath();x.moveTo(end.x+ux*s*.35,end.y+uy*s*.35);x.lineTo(b.x-uy*s*.38,b.y+ux*s*.38);x.lineTo(b.x+uy*s*.38,b.y-ux*s*.38);x.closePath();x.fillStyle=h?'#ffd933':col;x.fill();x.strokeStyle='rgba(10,10,12,.65)';x.lineWidth=2*d;x.stroke()}}
function ring(cx,cy,r,rx,a,col,key){x.save();x.translate(cx,cy);x.rotate(a);x.beginPath();x.ellipse(0,0,r,rx,0,0,Math.PI*2);x.strokeStyle='rgba(10,10,12,.58)';x.lineWidth=(hot===key?8:6)*d;x.stroke();x.beginPath();x.ellipse(0,0,r,rx,0,0,Math.PI*2);x.strokeStyle=hot===key?'#ffd933':col;x.lineWidth=(hot===key?5:3.5)*d;x.stroke();x.restore()}
function draw(){const w=c.width,h=c.height,cx=w*.5,cy=h*.56,s=Math.min(w,h)*.2;x.clearRect(0,0,w,h);x.fillStyle='#17181b';x.fillRect(0,0,w,h);ring(cx,cy,s*1.48,s*.78,0,'#ff5d5d','RX');ring(cx,cy,s*1.48,s*.78,Math.PI/2,'#4ade80','RY');ring(cx,cy,s*1.25,s*1.25,.6,'#3b9cff','RZ');x.beginPath();x.arc(cx,cy,s*1.68,0,Math.PI*2);x.strokeStyle=hot==='RS'?'#ffd933':'rgba(220,225,235,.7)';x.lineWidth=(hot==='RS'?4:2.5)*d;x.stroke();arrow(cx,cy,-s*.92,s*.58,'#3b9cff','MZ');arrow(cx,cy,s,s*.34,'#ff5d5d','MX');arrow(cx,cy,0,-s,'#4ade80','MY');arrow(cx,cy,-s*.52,s*.33,'#3b9cff','SZ',true);arrow(cx,cy,s*.57,s*.2,'#ff5d5d','SX',true);arrow(cx,cy,0,-s*.57,'#4ade80','SY',true);const q=7*d;x.fillStyle=hot==='MXYZ'?'#ffd933':'#ededed';x.fillRect(cx-q,cy-q,q*2,q*2);x.strokeStyle='rgba(10,10,12,.7)';x.lineWidth=1.5*d;x.strokeRect(cx-q,cy-q,q*2,q*2)}
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*d,my=(e.clientY-r.top)*d,cx=c.width*.5,cy=c.height*.56,s=Math.min(c.width,c.height)*.2;hot=Math.hypot(mx-cx,my-cy)<18*d?'MXYZ':Math.abs(Math.hypot(mx-cx,my-cy)-s*1.68)<12*d?'RS':null;for(const [key,dx,dy] of [['MX',1,.34],['MY',0,-1],['MZ',-.92,.58],['SX',.57,.2],['SY',0,-.57],['SZ',-.52,.33]])if(Math.hypot(mx-(cx+dx*s),my-(cy+dy*s))<18*d)hot=key;draw()});resize();
</script></body></html>
