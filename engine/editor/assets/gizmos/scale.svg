<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- UNIVEX Gizmo Icon: SCALE (XYZ with box handles) -->
  <g fill="none" stroke-linecap="round">
    <!-- Z axis -->
    <line x1="16" y1="17" x2="6" y2="24" stroke="#3B9CFF" stroke-width="2.2"/>
    <rect x="4" y="22" width="4" height="4" fill="#3B9CFF"/>
    <!-- X axis -->
    <line x1="16" y1="17" x2="27" y2="21" stroke="#FF5D5D" stroke-width="2.2"/>
    <rect x="25" y="19" width="4" height="4" fill="#FF5D5D"/>
    <!-- Y axis -->
    <line x1="16" y1="17" x2="16" y2="4" stroke="#4ADE80" stroke-width="2.2"/>
    <rect x="14" y="2" width="4" height="4" fill="#4ADE80"/>
    <!-- center uniform-scale box -->
    <rect x="13.2" y="14.2" width="5.6" height="5.6" fill="#EDEDED" stroke="#8A8A8A" stroke-width="1"/>
  </g>
</svg>
