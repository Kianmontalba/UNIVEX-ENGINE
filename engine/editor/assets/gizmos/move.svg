<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- UNIVEX Gizmo Icon: MOVE (Translate XYZ) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Z axis (back-left) -->
    <line x1="16" y1="17" x2="6" y2="24" stroke="#3B9CFF" stroke-width="2.2"/>
    <polygon points="6,24 9.2,23.3 8.1,26.4" fill="#3B9CFF"/>
    <!-- X axis (right) -->
    <line x1="16" y1="17" x2="27" y2="21" stroke="#FF5D5D" stroke-width="2.2"/>
    <polygon points="27,21 23.9,19.6 25.9,22.8" fill="#FF5D5D"/>
    <!-- Y axis (up) -->
    <line x1="16" y1="17" x2="16" y2="4" stroke="#4ADE80" stroke-width="2.2"/>
    <polygon points="16,4 13.6,8.4 18.4,8.4" fill="#4ADE80"/>
    <!-- center handle: Omni box (free view-plane move) -->
    <rect x="13.6" y="14.6" width="4.8" height="4.8" fill="#EDEDED" stroke="#8A8A8A" stroke-width="1"/>
  </g>
</svg>
