<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- UNIVEX Gizmo Icon: UNIVERSAL (Move + Rotate + Scale combined) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- faint rotate rings (background layer) -->
    <ellipse cx="16" cy="17" rx="12" ry="12" stroke="#5C5C5C" stroke-width="1" stroke-dasharray="1 3"/>
    <ellipse cx="16" cy="17" rx="12" ry="5" stroke="#4ADE80" stroke-width="1.3" opacity="0.55"/>

    <!-- Z axis: arrow + small box -->
    <line x1="16" y1="17" x2="6" y2="24" stroke="#3B9CFF" stroke-width="2"/>
    <polygon points="6,24 8.7,23.4 7.8,26" fill="#3B9CFF"/>
    <rect x="4.3" y="24.3" width="3" height="3" fill="#3B9CFF"/>

    <!-- X axis: arrow + small box -->
    <line x1="16" y1="17" x2="27" y2="21" stroke="#FF5D5D" stroke-width="2"/>
    <polygon points="27,21 24.3,19.8 26,22.6" fill="#FF5D5D"/>
    <rect x="26.5" y="21.3" width="3" height="3" fill="#FF5D5D"/>

    <!-- Y axis: arrow + small box -->
    <line x1="16" y1="17" x2="16" y2="4" stroke="#4ADE80" stroke-width="2"/>
    <polygon points="16,4 14,7.6 18,7.6" fill="#4ADE80"/>
    <rect x="14.5" y="1" width="3" height="3" fill="#4ADE80"/>

    <!-- center: combined handle (circle inside square) -->
    <rect x="13.4" y="14.4" width="5.2" height="5.2" fill="none" stroke="#EDEDED" stroke-width="1"/>
    <circle cx="16" cy="17" r="1.6" fill="#EDEDED"/>
  </g>
</svg>
