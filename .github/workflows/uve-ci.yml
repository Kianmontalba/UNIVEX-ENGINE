name: UVE CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: uve-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (gcc)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            g++ \
            ninja-build \
            libglfw3-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure Debug build
        run: >-
          cmake -S . -B build/ci-gcc -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++

      - name: Build UVE
        run: cmake --build build/ci-gcc --parallel

      - name: Run full unit-test suite
        run: ctest --test-dir build/ci-gcc --output-on-failure
