name: UVE CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: uve-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (gcc)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -Eeuo pipefail

          apt_diagnostics() {
            echo '--- APT diagnostics ---'
            sudo -n fuser -v /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock || true
            sudo -n dpkg --audit || true
            sudo -n apt-cache policy cmake g++ ninja-build libglfw3-dev libwayland-dev libxkbcommon-dev \
              libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libjpeg-dev || true
          }
          trap 'status=$?; apt_diagnostics; exit "$status"' ERR

          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=60
          )

          for attempt in 1 2 3; do
            echo "APT update attempt ${attempt}/3"
            if sudo -n timeout --signal=TERM --kill-after=30s 300s \
              apt-get "${apt_options[@]}" update; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo 'APT update failed after bounded retries.' >&2
              exit 1
            fi
            sleep 10
          done

          sudo -n timeout --signal=TERM --kill-after=30s 1200s \
            apt-get "${apt_options[@]}" install --yes --no-install-recommends --fix-missing \
              cmake \
              g++ \
              ninja-build \
              libglfw3-dev \
              libwayland-dev \
              libxkbcommon-dev \
              libxrandr-dev \
              libxi-dev \
              libxinerama-dev \
              libxcursor-dev \
              libjpeg-dev

      - name: Configure Debug build
        run: >-
          cmake -S . -B build/ci-gcc -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++

      - name: Build UVE
        run: cmake --build build/ci-gcc --parallel

      - name: Run full unit-test suite
        run: ctest --test-dir build/ci-gcc --output-on-failure


  managed-editor-host:
    name: managed-editor-host (.NET 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install native bridge build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -Eeuo pipefail

          apt_diagnostics() {
            echo '--- APT diagnostics ---'
            sudo -n fuser -v /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock || true
            sudo -n dpkg --audit || true
            sudo -n apt-cache policy cmake g++ ninja-build libglfw3-dev libwayland-dev libxkbcommon-dev \
              libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libjpeg-dev xvfb || true
          }
          trap 'status=$?; apt_diagnostics; exit "$status"' ERR

          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=60
          )

          for attempt in 1 2 3; do
            echo "APT update attempt ${attempt}/3"
            if sudo -n timeout --signal=TERM --kill-after=30s 300s \
              apt-get "${apt_options[@]}" update; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo 'APT update failed after bounded retries.' >&2
              exit 1
            fi
            sleep 10
          done

          sudo -n timeout --signal=TERM --kill-after=30s 1200s \
            apt-get "${apt_options[@]}" install --yes --no-install-recommends --fix-missing \
              cmake \
              g++ \
              ninja-build \
              libglfw3-dev \
              libwayland-dev \
              libxkbcommon-dev \
              libxrandr-dev \
              libxi-dev \
              libxinerama-dev \
              libxcursor-dev \
              libjpeg-dev \
              xvfb

      - name: Configure headless bridge backend
        run: >-
          cmake -S . -B build/ci-gcc -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++

      - name: Build bridge backend
        run: cmake --build build/ci-gcc --parallel --target uve_editor_app

      - name: Restore managed host with lock files
        run: dotnet restore editor/managed/UniVex.EditorHost.Tests/UniVex.EditorHost.Tests.csproj --locked-mode

      - name: Build managed host and tests
        run: dotnet build editor/managed/UniVex.EditorHost.Tests/UniVex.EditorHost.Tests.csproj --no-restore

      - name: Run managed unit tests
        run: dotnet test editor/managed/UniVex.EditorHost.Tests/UniVex.EditorHost.Tests.csproj --no-build --no-restore

      - name: Run managed shell desktop-start smoke
        run: |
          shell_home="${RUNNER_TEMP}/uve-shell-home"
          shell_runtime="${RUNNER_TEMP}/uve-shell-runtime"
          shell_log="${RUNNER_TEMP}/uve-shell-startup.log"
          rm -rf "${shell_home}" "${shell_runtime}"
          mkdir -p "${shell_home}" "${shell_runtime}"
          set +e
          HOME="${shell_home}" XDG_DATA_HOME="${shell_home}/data" XDG_RUNTIME_DIR="${shell_runtime}" \
            xvfb-run -a timeout 5s dotnet run --project editor/managed/UniVex.EditorHost/UniVex.EditorHost.csproj --no-build --no-restore \
            > "${shell_log}" 2>&1
          shell_status=$?
          set -e
          test "${shell_status}" -eq 124
          test ! -e "${shell_home}/data/UniVex/editor_host_layout.json"
          ! grep -Eiq 'exception|error AVLN|unhandled' "${shell_log}"

      - name: Run managed-to-native bridge probe
        run: ./tools/verify_editor_host_probe.sh ./build/ci-gcc/engine/app/uve_editor
